services:
    backend:
        image: mhalai/python-back-end
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${APP_PORT}:8000"
        volumes:
            - .:/app
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            DB_HOST: db
            DB_PORT: 5432

    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "${DB_PORT}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - db_data:/var/lib/postgresql18/data
    
    redis:
        image: redis:7-alpine
        ports:
            - "${REDIS_PORT}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 5s
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        environment:
            REDIS_HOST: ${REDIS_HOST}
            REDIS_PORT: ${REDIS_PORT}

volumes:
    db_data:
    redis_data:
